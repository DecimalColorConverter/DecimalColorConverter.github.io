<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>졸음 감지기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#20242a;font-family:Arial,"Noto Sans KR",sans-serif}
.app{width:min(920px,94vw);margin:20px auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:20px;box-shadow:0 10px 35px #00000012}
h1{margin:0 0 5px;font-size:25px}.sub{margin:0 0 16px;color:#6b7280;font-size:14px}
.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}
.videoBox{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.badge{position:absolute;left:10px;top:10px;padding:7px 10px;border-radius:999px;background:#fffffff0;font-weight:700;font-size:13px}
.side{display:flex;flex-direction:column;gap:9px}
.card{border:1px solid #e5e7eb;border-radius:13px;padding:12px}
.label{font-size:12px;color:#6b7280;margin-bottom:4px}.value{font-size:25px;font-weight:800}
.status{font-size:20px;font-weight:800}.normal{color:#167a45}.warn{color:#c62828}
button{width:100%;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:700;background:#20242a;color:#fff}
button:disabled{opacity:.45}
input{width:100%}.hint{font-size:12px;line-height:1.5;color:#6b7280}
.error{color:#c62828;font-size:13px;line-height:1.5;word-break:break-word}
@media(max-width:700px){
 .app{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;padding:14px;box-shadow:none}
 .grid{grid-template-columns:1fr}
 .videoBox{aspect-ratio:3/4;max-height:65vh}
 .side{display:grid;grid-template-columns:1fr 1fr}
 .side .controls,.side .hint,.side .error{grid-column:1/-1}
 .card{padding:10px}
 .value{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
<h1>졸음 감지기</h1>
<p class="sub">MediaPipe + EAR · 모바일 대응 버전</p>

<div class="grid">
<div class="videoBox">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<div class="badge" id="badge">준비 중...</div>
</div>

<div class="side">
<div class="card"><div class="label">평균 EAR</div><div class="value" id="ear">—</div></div>
<div class="card"><div class="label">눈 감김 시간</div><div class="value" id="closed">0.00 s</div></div>
<div class="card"><div class="label">상태</div><div class="status normal" id="status">준비 중</div></div>

<div class="card">
<div class="label">EAR 기준값: <span id="thresholdText">0.20</span></div>
<input id="threshold" type="range" min="0.12" max="0.35" step="0.01" value="0.20">
</div>

<div class="card">
<div class="label">졸음 판정: <span id="durationText">1.00 s</span></div>
<input id="duration" type="range" min="0.5" max="3" step="0.1" value="1">
</div>

<div class="controls">
<button id="start">카메라 시작</button>
<button id="stop" disabled>중지</button>
</div>
<div class="error" id="error"></div>
<div class="hint">카메라 권한을 허용해주세요. HTTPS에서 실행해야 카메라 접근이 가능합니다.</div>
</div>
</div>
</div>

<script type="module">
import {FaceLandmarker, FilesetResolver}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("canvas"),ctx=canvas.getContext("2d");
const startBtn=$("start"),stopBtn=$("stop"),badge=$("badge");
const earEl=$("ear"),closedEl=$("closed"),statusEl=$("status"),errorEl=$("error");
const threshold=$("threshold"),duration=$("duration");

let landmarker=null,stream=null,running=false,raf=0,lastTime=-1;
let closedStart=null,alarmCooldown=0;

const LEFT=[33,160,158,133,153,144];
const RIGHT=[362,385,387,263,373,380];

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function calcEAR(p,ids){
 const [a,b,c,d,e,f]=ids.map(i=>p[i]);
 return (dist(b,f)+dist(c,e))/(2*dist(a,d));
}

function setError(msg){
 errorEl.textContent=msg||"";
 console.error(msg);
}

async function createLandmarker(){
 badge.textContent="AI 모델 불러오는 중...";
 setError("");

 const vision=await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
 );

 const base={
  modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
 };

 // 모바일에서 GPU가 실패하면 CPU로 재시도
 try{
  landmarker=await FaceLandmarker.createFromOptions(vision,{
   baseOptions:{...base,delegate:"GPU"},
   runningMode:"VIDEO",numFaces:1
  });
 }catch(gpuError){
  console.warn("GPU failed, retrying with CPU",gpuError);
  landmarker=await FaceLandmarker.createFromOptions(vision,{
   baseOptions:{...base,delegate:"CPU"},
   runningMode:"VIDEO",numFaces:1
  });
 }
}

function draw(points,ids){
 ctx.beginPath();
 ids.forEach((id,i)=>{
  const p=points[id],x=p.x*canvas.width,y=p.y*canvas.height;
  i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 });
 ctx.closePath();
 ctx.stroke();
}

let audio=null;
function beep(){
 const now=Date.now();
 if(now-alarmCooldown<1500)return;
 alarmCooldown=now;
 try{
  audio ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=880;g.gain.value=.12;
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+.3);
 }catch(e){}
}

async function start(){
 setError("");
 startBtn.disabled=true;

 if(!window.isSecureContext){
  setError("현재 페이지가 HTTPS가 아닙니다. GitHub Pages 주소(https://...)로 접속해주세요.");
  startBtn.disabled=false;return;
 }
 if(!navigator.mediaDevices?.getUserMedia){
  setError("이 브라우저에서는 카메라 기능을 사용할 수 없습니다. 최신 Chrome/Safari를 사용해주세요.");
  startBtn.disabled=false;return;
 }

 try{
  if(!landmarker)await createLandmarker();

  // 모바일 전면 카메라 우선
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:"user"},
    width:{ideal:640,max:1280},
    height:{ideal:480,max:1280},
    frameRate:{ideal:20,max:30}
   }
  });

  video.srcObject=stream;
  await video.play();

  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  running=true;lastTime=-1;closedStart=null;
  stopBtn.disabled=false;
  badge.textContent="카메라 작동 중";
  statusEl.textContent="정상";
  loop();
 }catch(e){
  let msg="실행 실패: "+(e.message||e.name||e);
  if(e.name==="NotAllowedError")msg="카메라 권한이 거부되었습니다. 브라우저의 사이트 권한에서 카메라를 허용해주세요.";
  if(e.name==="NotFoundError")msg="사용할 수 있는 카메라를 찾지 못했습니다.";
  if(e.name==="NotReadableError")msg="카메라가 다른 앱에서 사용 중일 수 있습니다.";
  setError(msg);
  badge.textContent="실행 실패";
  statusEl.textContent="오류";
  startBtn.disabled=false;
 }
}

function stop(){
 running=false;
 cancelAnimationFrame(raf);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;closedStart=null;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 earEl.textContent="—";closedEl.textContent="0.00 s";
 statusEl.textContent="대기 중";statusEl.className="status normal";
 badge.textContent="카메라 대기 중";
 startBtn.disabled=false;stopBtn.disabled=true;
}

function loop(){
 if(!running)return;

 // 모바일 성능을 위해 너무 자주 추론하지 않음
 if(video.readyState>=2 && video.currentTime!==lastTime){
  lastTime=video.currentTime;
  try{
   const result=landmarker.detectForVideo(video,performance.now());
   ctx.clearRect(0,0,canvas.width,canvas.height);

   if(result.faceLandmarks?.length){
    const p=result.faceLandmarks[0];
    const l=calcEAR(p,LEFT),r=calcEAR(p,RIGHT),e=(l+r)/2;
    earEl.textContent=e.toFixed(3);

    ctx.strokeStyle=e<Number(threshold.value)?"#e53935":"#35a66f";
    ctx.lineWidth=3;draw(p,LEFT);draw(p,RIGHT);

    const now=performance.now();
    if(e<Number(threshold.value)){
     if(closedStart===null)closedStart=now;
     const sec=(now-closedStart)/1000;
     closedEl.textContent=sec.toFixed(2)+" s";
     if(sec>=Number(duration.value)){
      statusEl.textContent="졸음 감지";
      statusEl.className="status warn";
      badge.textContent="⚠ 졸음 감지";
      beep();
     }else{
      statusEl.textContent="눈 감김";
      statusEl.className="status warn";
      badge.textContent="눈 감김 측정 중";
     }
    }else{
     closedStart=null;closedEl.textContent="0.00 s";
     statusEl.textContent="정상";statusEl.className="status normal";
     badge.textContent="카메라 작동 중";
    }
   }else{
    earEl.textContent="—";closedEl.textContent="0.00 s";
    statusEl.textContent="얼굴을 찾는 중";
    statusEl.className="status normal";
    badge.textContent="얼굴 없음";
    closedStart=null;
   }
  }catch(e){setError("얼굴 분석 오류: "+e.message)}
 }
 raf=requestAnimationFrame(loop);
}

threshold.oninput=()=>$("thresholdText").textContent=Number(threshold.value).toFixed(2);
duration.oninput=()=>$("durationText").textContent=Number(duration.value).toFixed(2)+" s";
startBtn.onclick=start;stopBtn.onclick=stop;

if(!window.isSecureContext){
 badge.textContent="HTTPS 필요";
 setError("GitHub Pages의 https:// 주소에서 접속해주세요.");
}else{
 badge.textContent="시작 버튼을 눌러주세요";
}
</script>
</body>
</html>
