<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>졸음 감지기</title>

<!-- tasks-vision 번들 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm/vision_bundle.js" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{width:min(920px,94vw);margin:20px auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:20px}
h1{margin:0 0 5px;font-size:22px}.sub{margin:0 0 16px;color:#6b7280;font-size:13px}
.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}
.videoBox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.badge{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:999px;background:#ffffffe6;font-weight:700;font-size:12px;z-index:10}
.side{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid #e5e7eb;border-radius:12px;padding:10px}
.label{font-size:11px;color:#6b7280;margin-bottom:2px}.value{font-size:22px;font-weight:800}
.status{font-size:18px;font-weight:800}.normal{color:#167a45}.warn{color:#c62828}
.controls{display:flex;gap:8px;margin-top:5px}
button{flex:1;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;background:#111827;color:#fff}
button:disabled{opacity:.4}
input{width:100%}
#debugLog{background:#1e1e1e;color:#4af626;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
@media(max-width:700px){
 .app{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;padding:12px}
 .grid{grid-template-columns:1fr}
 .videoBox{aspect-ratio:3/4;max-height:50vh}
 .side{display:grid;grid-template-columns:1fr 1fr}
 .side .controls,.side #debugBox{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app">
 <h1>졸음 감지기</h1>
 <p class="sub">실시간 감지</p>

 <div class="grid">
  <div class="videoBox">
   <video id="video" autoplay muted playsinline webkit-playsinline></video>
   <canvas id="canvas"></canvas>
   <div class="badge" id="badge">엔진 준비 중...</div>
  </div>

  <div class="side">
   <div class="card"><div class="label">EAR (눈 개폐도)</div><div class="value" id="ear">—</div></div>
   <div class="card"><div class="label">감긴 시간</div><div class="value" id="closed">0.00 s</div></div>
   <div class="card"><div class="label">상태</div><div class="status normal" id="status">대기</div></div>

   <div class="card">
    <div class="label">기준값 (EAR): <span id="thText">0.21</span></div>
    <input id="threshold" type="range" min="0.12" max="0.32" step="0.01" value="0.21">
   </div>

   <div class="controls">
    <button id="startBtn" disabled>카메라 시작</button>
    <button id="stopBtn" disabled>중지</button>
   </div>

   <div id="debugBox" style="margin-top:8px">
    <div style="font-size:11px;font-weight:bold;margin-bottom:3px;color:#666">실행 로그</div>
    <div id="debugLog">리소스 불러오는 중...</div>
   </div>
  </div>
 </div>
</div>

<script>
const logEl = document.getElementById("debugLog");
function log(msg) {
  console.log(msg);
  logEl.textContent += "\n> " + msg;
  logEl.scrollTop = logEl.scrollHeight;
}

window.onerror = function(msg) {
  log(`[오류 발생] ${msg}`);
};

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const badge = document.getElementById("badge");
const earEl = document.getElementById("ear");
const closedEl = document.getElementById("closed");
const statusEl = document.getElementById("status");
const threshold = document.getElementById("threshold");
const thText = document.getElementById("thText");

let landmarker = null;
let stream = null;
let running = false;
let closedStart = null;
let lastTime = -1;

const LEFT = [33, 160, 158, 133, 153, 144];
const RIGHT = [362, 385, 387, 263, 373, 380];

threshold.oninput = () => thText.textContent = Number(threshold.value).toFixed(2);

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function calcEAR(p, ids) {
  const [a,b,c,d,e,f] = ids.map(i => p[i]);
  return (dist(b,f) + dist(c,e)) / (2 * dist(a,d));
}

// 전역 객체(tasksVision 또는 window)에서 모듈 추출 함수
function getVisionPackage() {
  if (window.tasksVision) return window.tasksVision;
  if (window.FaceLandmarker && window.FilesetResolver) return window;
  return null;
}

// 페이지 로드 완료 체크
window.addEventListener("load", () => {
  const pkg = getVisionPackage();
  if (pkg && pkg.FilesetResolver) {
    log("AI 엔진 파일 준비 완료!");
    badge.textContent = "시작 대기 중";
    startBtn.disabled = false;
  } else {
    log("라이브러리 로드 재시도 대기...");
    let timer = setInterval(() => {
      const p = getVisionPackage();
      if (p && p.FilesetResolver) {
        clearInterval(timer);
        log("AI 엔진 파일 준비 완료!");
        badge.textContent = "시작 대기 중";
        startBtn.disabled = false;
      }
    }, 500);
  }
});

// 카메라 오픈
async function openCamera() {
  log("카메라 스트림 요청 중...");
  const streamData = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode: "user",
      width: { ideal: 480 },
      height: { ideal: 640 }
    }
  });

  video.srcObject = streamData;
  stream = streamData;

  return new Promise((resolve) => {
    video.onloadedmetadata = async () => {
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      log(`카메라 켜짐 완료 (${video.videoWidth}x${video.videoHeight})`);
      resolve();
    };
  });
}

// AI 초기화
async function loadAI() {
  if (landmarker) return;
  
  const pkg = getVisionPackage();
  if (!pkg) {
    throw new Error("TasksVision 모듈을 찾을 수 없습니다.");
  }

  badge.textContent = "AI 모델 다운로드 중...";
  log("AI 모델 가중치 파일 다운로드 중...");

  const resolver = await pkg.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  landmarker = await pkg.FaceLandmarker.createFromOptions(resolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });

  log("AI 모델 준비 완료! 추론을 시작합니다.");
}

async function start() {
  startBtn.disabled = true;
  badge.textContent = "연결 중...";

  try {
    await openCamera();
    await loadAI();

    running = true;
    stopBtn.disabled = false;
    badge.textContent = "얼굴 감지 중";
    loop();
  } catch (err) {
    log("실패: " + err.message);
    badge.textContent = "에러";
    startBtn.disabled = false;
  }
}

function stop() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  badge.textContent = "정지됨";
  startBtn.disabled = false;
  stopBtn.disabled = true;
  log("카메라가 정지되었습니다.");
}

function loop() {
  if (!running) return;

  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    try {
      const res = landmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (res.faceLandmarks && res.faceLandmarks.length > 0) {
        const p = res.faceLandmarks[0];
        const ear = (calcEAR(p, LEFT) + calcEAR(p, RIGHT)) / 2;
        earEl.textContent = ear.toFixed(3);

        const th = Number(threshold.value);
        if (ear < th) {
          if (closedStart === null) closedStart = performance.now();
          const sec = (performance.now() - closedStart) / 1000;
          closedEl.textContent = sec.toFixed(2) + " s";

          if (sec >= 1.0) {
            statusEl.textContent = "졸음 감지!!";
            statusEl.className = "status warn";
            badge.textContent = "⚠️ 졸음 경고!";
          }
        } else {
          closedStart = null;
          closedEl.textContent = "0.00 s";
          statusEl.textContent = "정상";
          statusEl.className = "status normal";
          badge.textContent = "얼굴 감지 중";
        }
      } else {
        earEl.textContent = "—";
        statusEl.textContent = "얼굴 없음";
      }
    } catch(e) {}
  }
  requestAnimationFrame(loop);
}

startBtn.onclick = start;
stopBtn.onclick = stop;
</script>
</body>
</html>
