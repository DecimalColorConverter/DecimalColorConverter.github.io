<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>졸음 감지기 — EAR</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    background:#f5f6f8; color:#20242a; font-family:Arial,"Noto Sans KR",sans-serif;
  }
  .app{width:min(920px,94vw); background:white; border:1px solid #e5e7eb; border-radius:24px; padding:28px; box-shadow:0 12px 40px rgba(0,0,0,.08)}
  h1{margin:0 0 6px;font-size:28px}.sub{margin:0 0 22px;color:#6b7280}
  .grid{display:grid;grid-template-columns:1.45fr .8fr;gap:20px}
  .videoBox{position:relative;background:#111;border-radius:18px;overflow:hidden;aspect-ratio:16/10}
  video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
  canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
  .badge{position:absolute;left:14px;top:14px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.92);font-weight:700;font-size:14px}
  .side{display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid #e5e7eb;border-radius:16px;padding:16px}
  .label{font-size:13px;color:#6b7280;margin-bottom:6px}.value{font-size:30px;font-weight:800}
  .status{font-size:22px;font-weight:800}.normal{color:#167a45}.warn{color:#c62828}
  button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#20242a;color:white}
  button:disabled{opacity:.5;cursor:not-allowed}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  input{width:100%}
  .hint{font-size:13px;line-height:1.55;color:#6b7280}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.app{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <h1>졸음 감지기</h1>
  <p class="sub">MediaPipe Face Landmarker + EAR · 브라우저에서 실시간 처리</p>

  <div class="grid">
    <div class="videoBox">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="badge" id="cameraBadge">카메라 대기 중</div>
    </div>

    <div class="side">
      <div class="card">
        <div class="label">평균 EAR</div>
        <div class="value" id="ear">—</div>
      </div>
      <div class="card">
        <div class="label">눈 감김 시간</div>
        <div class="value" id="closedTime">0.00 s</div>
      </div>
      <div class="card">
        <div class="label">현재 상태</div>
        <div class="status normal" id="status">대기 중</div>
      </div>
      <div class="card">
        <div class="label">EAR 기준값</div>
        <div class="value" style="font-size:22px" id="thresholdText">0.20</div>
        <input id="threshold" type="range" min="0.12" max="0.35" step="0.01" value="0.20">
      </div>
      <div class="card">
        <div class="label">졸음 판정 시간</div>
        <div class="value" style="font-size:22px" id="durationText">1.00 s</div>
        <input id="duration" type="range" min="0.5" max="3" step="0.1" value="1">
      </div>
      <div class="controls">
        <button id="start">카메라 시작</button>
        <button id="stop" disabled>중지</button>
      </div>
      <div class="hint">
        EAR이 기준값보다 낮은 상태가 설정된 시간 이상 지속되면 졸음으로 판단합니다.
        카메라 영상과 측정값은 이 페이지 안에서 처리됩니다.
      </div>
    </div>
  </div>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const earEl = document.getElementById("ear");
const closedTimeEl = document.getElementById("closedTime");
const statusEl = document.getElementById("status");
const badge = document.getElementById("cameraBadge");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const threshold = document.getElementById("threshold");
const duration = document.getElementById("duration");
const thresholdText = document.getElementById("thresholdText");
const durationText = document.getElementById("durationText");

let faceLandmarker;
let stream = null;
let running = false;
let lastVideoTime = -1;
let eyesClosedStart = null;
let alarmOn = false;
let audioCtx = null;
let animationId = null;

// MediaPipe 얼굴 모델
async function loadModel() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });
}

// 눈 랜드마크 인덱스
// MediaPipe Face Mesh의 대표적인 눈 윤곽점
const LEFT_EYE  = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];

function distance(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function ear(points, ids){
  const [p1,p2,p3,p4,p5,p6] = ids.map(i => points[i]);
  const vertical1 = distance(p2,p6);
  const vertical2 = distance(p3,p5);
  const horizontal = distance(p1,p4);
  return (vertical1 + vertical2) / (2 * horizontal);
}

function drawEye(points, ids){
  ctx.beginPath();
  ids.forEach((id,i)=>{
    const p = points[id];
    const x = p.x * canvas.width;
    const y = p.y * canvas.height;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.stroke();
}

function beep(){
  if(alarmOn) return;
  alarmOn = true;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.12;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  } catch(e) {}
}

function resetAlarm(){
  alarmOn = false;
}

async function startCamera(){
  if(!faceLandmarker) {
    statusEl.textContent = "모델 불러오는 중...";
    await loadModel();
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video: {facingMode:"user", width:{ideal:1280}, height:{ideal:720}},
    audio:false
  });
  video.srcObject = stream;
  await video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  running = true;
  lastVideoTime = -1;
  eyesClosedStart = null;
  startBtn.disabled = true;
  stopBtn.disabled = false;
  badge.textContent = "카메라 작동 중";
  statusEl.textContent = "정상";
  statusEl.className = "status normal";
  loop();
}

function stopCamera(){
  running = false;
  if(animationId) cancelAnimationFrame(animationId);
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  eyesClosedStart = null;
  earEl.textContent = "—";
  closedTimeEl.textContent = "0.00 s";
  statusEl.textContent = "대기 중";
  statusEl.className = "status normal";
  badge.textContent = "카메라 대기 중";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  startBtn.disabled = false;
  stopBtn.disabled = true;
  resetAlarm();
}

function loop(){
  if(!running) return;

  if(video.currentTime !== lastVideoTime){
    lastVideoTime = video.currentTime;
    const result = faceLandmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(result.faceLandmarks && result.faceLandmarks.length){
      const points = result.faceLandmarks[0];
      const leftEAR = ear(points, LEFT_EYE);
      const rightEAR = ear(points, RIGHT_EYE);
      const avgEAR = (leftEAR + rightEAR) / 2;

      earEl.textContent = avgEAR.toFixed(3);

      ctx.strokeStyle = avgEAR < Number(threshold.value) ? "#e53935" : "#35a66f";
      ctx.lineWidth = 3;
      drawEye(points, LEFT_EYE);
      drawEye(points, RIGHT_EYE);

      const now = performance.now();
      if(avgEAR < Number(threshold.value)){
        if(eyesClosedStart === null) eyesClosedStart = now;
        const seconds = (now - eyesClosedStart) / 1000;
        closedTimeEl.textContent = seconds.toFixed(2) + " s";

        if(seconds >= Number(duration.value)){
          statusEl.textContent = "졸음 감지";
          statusEl.className = "status warn";
          badge.textContent = "⚠ 졸음 감지";
          beep();
        } else {
          statusEl.textContent = "눈 감김";
          statusEl.className = "status warn";
          badge.textContent = "눈 감김 측정 중";
        }
      } else {
        eyesClosedStart = null;
        closedTimeEl.textContent = "0.00 s";
        statusEl.textContent = "정상";
        statusEl.className = "status normal";
        badge.textContent = "카메라 작동 중";
        resetAlarm();
      }
    } else {
      earEl.textContent = "—";
      closedTimeEl.textContent = "0.00 s";
      statusEl.textContent = "얼굴을 찾는 중";
      statusEl.className = "status normal";
      badge.textContent = "얼굴 없음";
      eyesClosedStart = null;
      resetAlarm();
    }
  }

  animationId = requestAnimationFrame(loop);
}

threshold.addEventListener("input",()=>{
  thresholdText.textContent = Number(threshold.value).toFixed(2);
});
duration.addEventListener("input",()=>{
  durationText.textContent = Number(duration.value).toFixed(2) + " s";
});
startBtn.addEventListener("click", async()=>{
  try { await startCamera(); }
  catch(err){
    console.error(err);
    statusEl.textContent = "카메라 권한 필요";
    badge.textContent = "카메라를 사용할 수 없음";
    alert("카메라 권한을 허용해주세요. 파일을 직접 열었을 때 브라우저에 따라 카메라가 제한될 수 있습니다.");
  }
});
stopBtn.addEventListener("click", stopCamera);
</script>
</body>
</html>
