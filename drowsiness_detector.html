<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>졸음 감지기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{width:min(920px,94vw);margin:20px auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:20px}
h1{margin:0 0 5px;font-size:22px}.sub{margin:0 0 16px;color:#6b7280;font-size:13px}
.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}
.videoBox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}
.badge{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:999px;background:#ffffffe6;font-weight:700;font-size:12px;z-index:10}
.side{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid #e5e7eb;border-radius:12px;padding:10px}
.label{font-size:11px;color:#6b7280;margin-bottom:2px}.value{font-size:22px;font-weight:800}
.status{font-size:18px;font-weight:800}.normal{color:#167a45}.warn{color:#c62828}
.controls{display:flex;gap:8px;margin-top:5px}
button{flex:1;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;background:#111827;color:#fff}
button:disabled{opacity:.4}
input{width:100%}
#debugLog{background:#1e1e1e;color:#4af626;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
@media(max-width:700px){
 .app{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;padding:12px}
 .grid{grid-template-columns:1fr}
 .videoBox{aspect-ratio:3/4;max-height:50vh}
 .side{display:grid;grid-template-columns:1fr 1fr}
 .side .controls,.side #debugBox{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app">
 <h1>졸음 감지기</h1>
 <p class="sub">실시간 눈 감김 감지</p>

 <div class="grid">
  <div class="videoBox">
   <video id="video" autoplay muted playsinline webkit-playsinline></video>
   <canvas id="canvas"></canvas>
   <div class="badge" id="badge">대기 중</div>
  </div>

  <div class="side">
   <div class="card"><div class="label">EAR (눈 개폐도)</div><div class="value" id="ear">—</div></div>
   <div class="card"><div class="label">감긴 시간</div><div class="value" id="closed">0.00 s</div></div>
   <div class="card"><div class="label">상태</div><div class="status normal" id="status">정상</div></div>

   <div class="card">
    <div class="label">임계값: <span id="thText">0.21</span></div>
    <input id="threshold" type="range" min="0.12" max="0.32" step="0.01" value="0.21">
   </div>

   <div class="controls">
    <button id="startBtn">카메라 시작</button>
    <button id="stopBtn" disabled>중지</button>
   </div>

   <div id="debugBox" style="margin-top:8px">
    <div style="font-size:11px;font-weight:bold;margin-bottom:3px;color:#666">실행 로그 (문제가 생기면 확인하세요)</div>
    <div id="debugLog">페이지 로딩 완료.</div>
   </div>
  </div>
 </div>
</div>

<script>
// 모바일 화면에서 오류를 바로 확인할 수 있는 로거
const logEl = document.getElementById("debugLog");
function log(msg) {
  console.log(msg);
  logEl.textContent += "\n> " + msg;
  logEl.scrollTop = logEl.scrollHeight;
}

window.onerror = function(msg, url, line) {
  log(`[JS 오류] ${msg} (line: ${line})`);
};
</script>

<script type="module">
// CDN 라이브러리 동적 로드 (모듈 로딩 실패 방지)
log("AI 엔진 로드 시도...");
let FaceLandmarker, FilesetResolver;

try {
  const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm/vision_bundle.mjs");
  FaceLandmarker = vision.FaceLandmarker;
  FilesetResolver = vision.FilesetResolver;
  log("AI 엔진 파일 로드 성공!");
} catch(err) {
  log("AI 로드 실패: " + err.message);
  alert("네트워크 상태를 확인해주세요. AI 모듈 다운로드에 실패했습니다.");
}

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const badge = document.getElementById("badge");
const earEl = document.getElementById("ear");
const closedEl = document.getElementById("closed");
const statusEl = document.getElementById("status");
const threshold = document.getElementById("threshold");
const thText = document.getElementById("thText");

let landmarker = null;
let stream = null;
let running = false;
let closedStart = null;
let lastTime = -1;

const LEFT = [33, 160, 158, 133, 153, 144];
const RIGHT = [362, 385, 387, 263, 373, 380];

threshold.oninput = () => thText.textContent = Number(threshold.value).toFixed(2);

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function calcEAR(p, ids) {
  const [a,b,c,d,e,f] = ids.map(i => p[i]);
  return (dist(b,f) + dist(c,e)) / (2 * dist(a,d));
}

// 1. 카메라 먼저 켜기
async function openCamera() {
  log("카메라 접근 권한 요청 중...");
  
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("이 브라우저는 카메라 권한을 지원하지 않거나, HTTPS(보안연결)가 아닙니다.");
  }

  // 모바일 호환을 위해 가장 기초적인 제약 조건 적용
  const constraints = {
    audio: false,
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 }
    }
  };

  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;

  return new Promise((resolve) => {
    video.onloadedmetadata = async () => {
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      log(`카메라 연결 완료 (${video.videoWidth}x${video.videoHeight})`);
      resolve();
    };
  });
}

// 2. 모델 로드
async function loadAI() {
  if (landmarker) return;
  badge.textContent = "AI 모델 다운로드 중...";
  log("AI 세부 모델 초기화 중...");
  
  const resolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );
  
  // 모바일 브라우저 안정성을 위해 기본 CPU로 시작 (GPU 충돌 방지)
  landmarker = await FaceLandmarker.createFromOptions(resolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });
  log("AI 모델 준비 완료!");
}

async function start() {
  startBtn.disabled = true;
  badge.textContent = "연결 중...";
  
  try {
    // 인앱 브라우저 체크
    const ua = navigator.userAgent.toLowerCase();
    if (ua.includes("kakaotalk") || ua.includes("naver") || ua.includes("instagram")) {
      alert("카카오톡/네이버 등 인앱브라우저에서는 카메라가 차단됩니다. 우측 상단 메뉴를 눌러 [Safari 또는 Chrome으로 열기]를 눌러주세요.");
    }

    // 카메라를 먼저 빠르게 띄움 (화면 반응성 향상)
    await openCamera();
    
    // 이후 모델 다운로드 진행
    await loadAI();

    running = true;
    stopBtn.disabled = false;
    badge.textContent = "감지 작동 중";
    loop();
  } catch (err) {
    log("실패: " + err.message);
    badge.textContent = "에러 발생";
    alert("카메라 실행 실패:\n" + err.message);
    startBtn.disabled = false;
  }
}

function stop() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  badge.textContent = "정지됨";
  startBtn.disabled = false;
  stopBtn.disabled = true;
  log("카메라가 중지되었습니다.");
}

function loop() {
  if (!running) return;

  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    try {
      const res = landmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (res.faceLandmarks && res.faceLandmarks.length > 0) {
        const p = res.faceLandmarks[0];
        const ear = (calcEAR(p, LEFT) + calcEAR(p, RIGHT)) / 2;
        earEl.textContent = ear.toFixed(3);

        const th = Number(threshold.value);
        if (ear < th) {
          if (closedStart === null) closedStart = performance.now();
          const sec = (performance.now() - closedStart) / 1000;
          closedEl.textContent = sec.toFixed(2) + " s";
          
          if (sec >= 1.0) {
            statusEl.textContent = "졸음 감지!!";
            statusEl.className = "status warn";
          }
        } else {
          closedStart = null;
          closedEl.textContent = "0.00 s";
          statusEl.textContent = "정상";
          statusEl.className = "status normal";
        }
      } else {
        earEl.textContent = "—";
        statusEl.textContent = "얼굴 없음";
      }
    } catch(e) {}
  }
  requestAnimationFrame(loop);
}

startBtn.onclick = start;
stopBtn.onclick = stop;
</script>
</body>
</html>
